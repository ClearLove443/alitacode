name: create-excalidraw-dataflow
description: "Create data flow diagrams (DFD) in Excalidraw format"
author: "BMad"

# Config values
config_source: ".alita/.alita-core/bmm/config.yaml"
output_folder: "{config_source}:output_folder"

# Workflow components
installed_path: ".alita/.alita-core/bmm/workflows/excalidraw-diagrams/create-dataflow"
shared_path: ".alita/.alita-core/bmm/workflows/excalidraw-diagrams/_shared"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

# Core Excalidraw resources (universal knowledge)
helpers: ".alita/.alita-core/core/resources/excalidraw/excalidraw-helpers.md"
json_validation: ".alita/.alita-core/core/resources/excalidraw/validate-json-instructions.md"

# Domain-specific resources (technical diagrams)
templates: "{shared_path}/excalidraw-templates.yaml"
library: "{shared_path}/excalidraw-library.json"

# Output file (respects user's configured output_folder)
default_output_file: "{output_folder}/excalidraw-diagrams/dataflow-{timestamp}.excalidraw"

standalone: true